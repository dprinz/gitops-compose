server {
    listen 80;
    server_name _;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /data {
        default_type application/json;
        alias /srv/demo-data/record.json;
    }

    location / {
        default_type text/plain;
        return 200 "gitops-compose release=v1\n";
    }
}

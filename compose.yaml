name: ${COMPOSE_PROJECT_NAME:-gitops-compose}

services:
  data:
    image: alpine:3.21.3@sha256:a8560b36e8b8210634f77d9f7f9efd7ffa463e380b75e2e74aff4511df3ef88c
    command: ["/bin/sh", "/opt/demo/data-service.sh"]
    restart: unless-stopped
    volumes:
      - demo-data:/data
      - ./scripts/data-service.sh:/opt/demo/data-service.sh:ro
    secrets:
      - demo_token
    labels:
      demo.gitops.desired-state: ${DESIRED_STATE_SHA:?run commands through scripts/compose.sh}
      demo.gitops.service: data
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/secrets/demo_token && test -s /data/record.json && grep -Eq '\"schema\":[[:space:]]*[12]' /data/record.json"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 1s

  web:
    image: nginx:1.27.5-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    depends_on:
      data:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - demo-data:/srv/demo-data:ro
    labels:
      demo.gitops.desired-state: ${DESIRED_STATE_SHA:?run commands through scripts/compose.sh}
      demo.gitops.service: web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health | grep -q '^ok$'"]
      interval: 2s
      timeout: 1s
      retries: 10
      start_period: 1s

volumes:
  demo-data:

secrets:
  demo_token:
    file: ./secrets/demo-token.txt
